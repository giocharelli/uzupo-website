<body>

<div class="loader">
  <div class="loader__mark">
    <img src="/assets/logos/uzupologoamber.png" alt="uzupo" class="loader__logo">
    <div class="loader__underline"></div>
  </div>
</div>

<nav class="nav">
  <a href="/" class="nav__logo" aria-label="uzupo home">
    <img src="/assets/logos/uzupologoamber.png" alt="uzupo">
  </a>
  <div class="nav__links">
    <a href="/about" class="nav__link">About</a>
    <a href="/services" class="nav__link">Services</a>
    <a href="/portfolio" class="nav__link">Portfolio</a>
    <a href="/contact" class="nav__cta magnetic"><span class="magnetic__content">Get in touch</span></a>
  </div>
  <button class="nav__burger" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav__overlay">
  <button class="nav__overlay-close" aria-label="Close menu"></button>
  <div class="nav__overlay-links">
    <a href="/about" class="nav__overlay-link"><span>About</span></a>
    <a href="/services" class="nav__overlay-link"><span>Services</span></a>

    <a href="/contact" class="nav__overlay-link"><span>Get in touch</span></a>
  </div>
</div>

<main>

  <!-- SECTION 1 — PAGE HERO -->
  <section class="work-hero">
    <span class="label work-hero__label">Portfolio</span>
    <h1 class="heading" data-reveal="lines-immediate">
      <span class="reveal-line"><span class="inner">Portfolio.</span></span>
    </h1>
    <p class="body-text work-hero__subline reveal-body">
      Feature films, short films, animations, games, commercials.
      Every project treated like the only one.
    </p>
  </section>

  <!-- SECTION 2 — FILTER BAR -->
  <div class="filter-bar">
    <button class="filter-btn is-active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="film">Film</button>
    <button class="filter-btn" data-filter="animation">Animation</button>
    <button class="filter-btn" data-filter="short-film">Short Film</button>
  </div>

  <!-- SECTION 3 — PROJECT POSTER GRID -->
  <section class="work-poster-grid">

    <button type="button" class="work-card" data-category="film" data-project="touching-the-sky">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/touching-the-sky.jpg" alt="Touching the Sky" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Touching the Sky</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="film" data-project="blackbird">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/blackbird.jpg" alt="Blackbird Was Chirping" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Blackbird Was Chirping</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="film" data-project="air-blue-silk">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/air-blue-silk.jpg" alt="Air Blue Silk" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Air Blue Silk</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="film" data-project="field">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/field.jpg" alt="Field" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Field</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="film" data-project="the-gamers">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/the-gamers.jpg" alt="The Gamers: Dornkess Falls" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">The Gamers: Dornkess Falls</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="film" data-project="freud">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/freud.jpg" alt="Freud And His Wolf-Man" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Freud And His Wolf-Man</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="animation" data-project="elene-dariani">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/elene-dariani.jpg" alt="Elene Dariani" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Elene Dariani</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="animation" data-project="what-made-you-tired">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/what-made-you-tired.jpg" alt="What Made You Tired?" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">What Made You Tired?</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="animation" data-project="oh-mother-mother">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/oh-mother-mother.jpg" alt="Oh, Mother Mother" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Oh, Mother Mother</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="short-film" data-project="inhale">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/inhale.jpg" alt="Inhale" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Inhale</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="short-film" data-project="horse-fly">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/horse-fly.jpg" alt="Horse Fly" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Horse Fly</h3>
      </div>
    </button>

    <button type="button" class="work-card" data-category="short-film" data-project="silent-blues">
      <div class="work-card__image img-reveal"><img src="/assets/images/projects/silent-blues.jpg" alt="Silent Blues" loading="lazy"></div>
      <div class="work-card__info">
        <h3 class="work-card__title">Silent Blues</h3>
      </div>
    </button>

  </section>

<!-- PROJECT MODAL -->
<div class="modal" id="project-modal" hidden>
  <div class="modal__backdrop" data-modal-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button type="button" class="modal__close" data-modal-close aria-label="Close">&times;</button>
    <div class="modal__poster"><img id="modal-poster" src="" alt=""></div>
    <div class="modal__info">
      <span class="label modal__label" id="modal-service"></span>
      <h3 class="modal__title" id="modal-title"></h3>
      <p class="modal__credit" id="modal-credit"></p>
      <p class="modal__festival" id="modal-festival"></p>
      <p class="modal__description" id="modal-description"></p>
    </div>
  </div>
</div>
